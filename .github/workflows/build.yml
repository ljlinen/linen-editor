name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install && npm run build
      - run: npx cap add android
      - run: |
          cp native/*.java android/app/src/main/java/com/linen/editor/
          echo 'dependencies { implementation "androidx.documentfile:documentfile:1.0.1" }' >> android/app/build.gradle
          npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: linen-editor, path: android/app/build/outputs/apk/debug/app-debug.apk }
